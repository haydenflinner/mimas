[workspace]
resolver = "2"
members = ["crates/*", "examples/*"]
# bevy is huge, so its crate + the examples stay out of the default workspace build. mimas pulls
# crates/bevy in only through its optional `bevy` feature.
exclude = ["examples/bevy", "crates/bevy"]

[workspace.package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/imlazyeye/mimas"
homepage = "https://mim.as"
rust-version = "1.95"

# thin + parallel CGUs: fat LTO serializes the whole dep graph into one
# module (the single biggest wait in a clean release build) for a ~1-3%
# codegen gain on code whose hot paths are Cranelift-emitted anyway.
# `cargo build --profile dist` keeps the maximal settings for artifacts.
[profile.release]
lto = "thin"
codegen-units = 16
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# keep file:line in panic backtraces but drop variable-level DWARF -- big cut to debug-info
# generated + linked across the ~24 test binaries, where the dev loop spends its time.
[profile.dev]
debug = "line-tables-only"

[workspace.dependencies]
glam = { version = "0.32", default-features = false, features = ["std"] }
static_assertions = "1.1"
codespan-reporting = "0.13"
colored = "2"
pretty_assertions = "1.1"
itertools = "0.10"
hashbrown = { version = "0.13" }
rand = "0.10"
lazy_static = "1.4"
bitflags = "1.3"
chompy = "0.5"
indexmap = "2.14.0"
mutants = "0.0.4"
gc-arena = "0.7"
miette = { version = "7.6", features = ["fancy"] }
thiserror = "1"
walkdir = "2"
