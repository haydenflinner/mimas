# Every crate moves together, so one version covers the whole release.
shared-version = true

# jj keeps git's HEAD detached, so there is no branch for the default allowlist (`["*", "!HEAD"]`) 
# to match -- it excludes `HEAD` by name.
allow-branch = ["*"]

# Handled elsewhere. Off rather than merely unused, so a stray `cargo release <level>` can't
# publish or push a release that was never meant to go out.
publish = false
push = false
tag = false

# Promote the accumulated notes into a dated section, leave a fresh `## [Unreleased]` behind
# for the next cycle, and add the link reference the new heading needs.
pre-release-replacements = [
  { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
  { file = "CHANGELOG.md", search = "<!-- next-release -->", replace = "<!-- next-release -->\n[{{version}}]: https://github.com/imlazyeye/mimas/releases/tag/v{{version}}", exactly = 1 },
]
