[package]
name = "bc-bench"
version = "0.0.0"
edition = "2021"
publish = false
description = "Four-way benchmark: plain mimas VM vs bcgen-specialized bodies vs Cranelift-JIT'd bodies vs handwritten native Rust, over the shared .mim benchmark suite."

[dependencies]
mimas = { path = "../../crates/mimas" }
bcgen = { package = "mimas-bcgen", path = "../../crates/bcgen" }
jit = { package = "mimas-jit", path = "../../crates/jit" }

[build-dependencies]
mimas = { path = "../../crates/mimas" }
bcgen = { package = "mimas-bcgen", path = "../../crates/bcgen" }
rustgen = { path = "../../../host/rustgen" }

[profile.release]
lto = "thin"
codegen-units = 16

[workspace]
