[package]
name = "mimas-bcgen-test"
version = "0.2.0"
edition = "2024"
publish = false
description = "Parity harness for mimas-bcgen: fixtures are compiled and specialized at build time, then run under the plain VM and under `install_bc` bodies and diffed."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lib]
name = "bcgen_test"

[dependencies]
vm = { package = "mimas-vm", path = "../vm", version = "0.2.0", default-features = false }

[build-dependencies]
vm = { package = "mimas-vm", path = "../vm", version = "0.2.0", default-features = false }
bcgen = { package = "mimas-bcgen", path = "../bcgen", version = "0.2.0" }
