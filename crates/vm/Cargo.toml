[package]
name = "mimas-vm"
version = "0.1.0"
edition = "2024"
description = "Register-based virtual machine for the mimas language. Internal to mimas; not intended for direct use."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lib]
name = "vm"
path = "src/lib.rs"

[dependencies]
solve = { package = "mimas-solve", path = "../solve", version = "0.1.0" }
shared = { package = "mimas-shared", path = "../shared", version = "0.1.0" }
compile = { package = "mimas-compile", path = "../compile", version = "0.1.0" }
parse = { package = "mimas-parse", path = "../parse", version = "0.1.0" }
api = { package = "mimas-api", path = "../api", version = "0.1.0" }
macros = { package = "mimas-macros", path = "../macros", version = "0.1.0" }
inventory = "0.3"
itertools.workspace = true
indexmap.workspace = true
mutants.workspace = true
gc-arena.workspace = true
miette.workspace = true
thiserror.workspace = true
smallvec = "1.15.1"
rustc-hash = "2"
itoa = "1.0.18"
# the local clone at ~/code/dsa/polars, not crates.io -- `lazy` pulls in polars-plan's `Expr`
# builder (needed for the `df.filter(col("x") > 5)` query surface), `fmt` gives DataFrame a real
# Display impl (used by `print`/f-strings), the rest is polars' own "default" feature set. `csv`
# lives on `library`'s polars dep instead (that's the only crate that reads csv), not here. NOT
# enabling `streaming`: this local clone's `polars-io` cloud module doesn't build against its
# pinned `object_store` version, and we don't need it anyway -- every query we ever build here is
# a small in-memory transform, so `library::std_lib::dataframe` always calls
# `collect_with_engine(Engine::InMemory)` explicitly instead of plain `collect()` (whose
# `Engine::Auto` would otherwise pick the streaming engine and panic without the feature).
polars = { path = "/Users/wow/code/dsa/polars/crates/polars", default-features = false, features = [
    "lazy",
    "fmt",
    "dtype-full",
] }

[features]
op-count = []

[dev-dependencies]
pretty_assertions.workspace = true
