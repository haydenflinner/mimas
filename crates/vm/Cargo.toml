[package]
name = "mimas-vm"
version = "0.2.0"
edition = "2024"
description = "Register-based virtual machine for the mimas language. Internal to mimas; not intended for direct use."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lib]
name = "vm"
path = "src/lib.rs"

[dependencies]
solve = { package = "mimas-solve", path = "../solve", version = "0.2.0" }
shared = { package = "mimas-shared", path = "../shared", version = "0.2.0" }
compile = { package = "mimas-compile", path = "../compile", version = "0.2.0" }
parse = { package = "mimas-parse", path = "../parse", version = "0.2.0" }
api = { package = "mimas-api", path = "../api", version = "0.2.0" }
macros = { package = "mimas-macros", path = "../macros", version = "0.2.0" }
inventory = "0.3"
itertools.workspace = true
indexmap.workspace = true
mutants.workspace = true
gc-arena.workspace = true
miette.workspace = true
thiserror.workspace = true
smallvec = "1.15.1"
rustc-hash = "2"
itoa = "1.0.18"
glam.workspace = true
# the local clone at ~/code/dsa/polars, not crates.io -- `lazy` pulls in polars-plan's `Expr`
# builder (needed for the `df.filter(col("x") > 5)` query surface), `fmt` gives DataFrame a real
# Display impl (used by `print`/f-strings), the rest is polars' own "default" feature set. `csv`
# lives on `library`'s polars dep instead (that's the only crate that reads csv), not here. NOT
# enabling `streaming`: this local clone's `polars-io` cloud module doesn't build against its
# pinned `object_store` version, and we don't need it anyway -- every query we ever build here is
# a small in-memory transform, so `library::std_lib::dataframe` always calls
# `collect_with_engine(Engine::InMemory)` explicitly instead of plain `collect()` (whose
# `Engine::Auto` would otherwise pick the streaming engine and panic without the feature).
# `optional = true`: gated behind the `dataframe` feature below so an embedder who never touches
# `Val::DataFrame`/`Val::PlExpr` doesn't pay for polars's dependency tree at all.
polars = { path = "/Users/wow/code/dsa/polars/crates/polars", optional = true, default-features = false, features = [
    "lazy",
    "fmt",
    "dtype-full",
] }

[features]
default = ["dataframe", "darkly"]
# Val::DataFrame/Val::PlExpr, operator overloading for them in bin(), and the polars dependency
# itself. On by default so existing embedders see no change; `default-features = false` opts out.
dataframe = ["dep:polars"]
# Val::DarklyImage -- decoded pixel bytes from a `.darkly` layer (std::darkly::open, in
# `library`). No extra dependency at this layer: `RawImage` is a plain owned Rust struct, so this
# feature only exists for symmetry with `dataframe` (an embedder who never touches
# `std::darkly` can still opt the variant itself out) and to gate `library`'s actual `zip`/`serde`
# dependencies behind its own same-named feature.
darkly = []
op-count = []

[dev-dependencies]
pretty_assertions.workspace = true
