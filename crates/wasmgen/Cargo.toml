[package]
name = "mimas-wasmgen"
version = "0.2.0"
edition = "2024"
publish = false
description = "mimas bytecode to wasm emitter: one exported fn per scalar-eligible chunk; unsupported bodies are skipped for the interpreter lane."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lib]
name = "mimas_wasmgen"

[dependencies]
compile = { package = "mimas-compile", path = "../compile", version = "0.2.0" }
shared = { package = "mimas-shared", path = "../shared", version = "0.2.0" }
waffle = "0.3.2"
wasm-encoder = "0.242"

[dev-dependencies]
vm = { package = "mimas-vm", path = "../vm", version = "0.2.0" }
mimas = { package = "mimas", path = "../mimas", version = "0.2.0" }
api = { package = "mimas-api", path = "../api", version = "0.2.0" }
wasmparser = "0.242"

# the `wgbench` example times the interpreter against this crate's wasm
# under wasmtime, which has no wasm32 build
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.wasmtime]
version = "49.0.2"
default-features = false
features = ["cranelift", "runtime"]
