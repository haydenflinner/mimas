[package]
name = "mimas-jit-test"
version = "0.2.0"
edition = "2024"
publish = false
description = "Parity harness for mimas-jit: fixtures are compiled to Programs and JIT'd at test time, then run under the plain VM and under `install_bc` JIT bodies and diffed."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lib]
name = "jit_test"

[dependencies]
vm = { package = "mimas-vm", path = "../vm", version = "0.2.0", default-features = false }
jit = { package = "mimas-jit", path = "../jit" }
compile = { package = "mimas-compile", path = "../compile" }
