[package]
name = "mimas-library"
version = "0.1.0"
edition = "2024"
description = "Standard library for the mimas language. Internal to mimas; not intended for direct use."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lib]
name = "library"
path = "src/lib.rs"

[dependencies]
vm = { package = "mimas-vm", path = "../vm", version = "0.1.0" }
api = { package = "mimas-api", path = "../api", version = "0.1.0" }
shared = { package = "mimas-shared", path = "../shared", version = "0.1.0" }
macros = { package = "mimas-macros", path = "../macros", version = "0.1.0" }
chompy.workspace = true
heck = "0.5.0"
regex = "1.12.3"
itertools.workspace = true
rand.workspace = true
camino = "1.2.2"
serde_json = "1.0.145"
walkdir.workspace = true
polars = { path = "/Users/wow/code/dsa/polars/crates/polars", default-features = false, features = [
    "lazy",
    "fmt",
    "dtype-full",
] }
# depended on directly (not via `polars`'s own `csv` feature) for `CsvReadOptions`/`CsvReader`,
# used by `std_lib::dataframe::from_csv` to read an in-memory CSV string into a `DataFrame`.
# `polars`'s own `csv` feature unconditionally bundles in `streaming`, which this local clone's
# `polars-io` cloud module doesn't build against (an unrelated `object_store` version mismatch --
# see the note on the `polars` dep above); `polars-io/csv` on its own pulls in neither. Same repo
# path as the `polars` dep above, so Cargo resolves this to the identical `DataFrame`/`Column`
# types `polars::frame`/`polars::prelude` re-export, not a second copy.
polars-io = { path = "/Users/wow/code/dsa/polars/crates/polars-io", default-features = false, features = [
    "csv",
] }

[dev-dependencies]
parse = { package = "mimas-parse", path = "../parse", version = "0.1.0" }
solve = { package = "mimas-solve", path = "../solve", version = "0.1.0" }
compile = { package = "mimas-compile", path = "../compile", version = "0.1.0" }
pretty_assertions.workspace = true
