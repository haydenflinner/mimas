[package]
name = "mimas-library"
version = "0.2.0"
edition = "2024"
description = "Standard library for the mimas language. Internal to mimas; not intended for direct use."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lib]
name = "library"
path = "src/lib.rs"

[dependencies]
vm = { package = "mimas-vm", path = "../vm", version = "0.2.0", default-features = false }
api = { package = "mimas-api", path = "../api", version = "0.2.0" }
shared = { package = "mimas-shared", path = "../shared", version = "0.2.0" }
macros = { package = "mimas-macros", path = "../macros", version = "0.2.0" }
chompy.workspace = true
heck = "0.5.0"
regex = "1.12.3"
itertools.workspace = true
rand.workspace = true
camino = "1.2.2"
serde_json = "1.0.145"
walkdir.workspace = true
# both optional, gated behind the `dataframe` feature below -- see the note on `vm`'s `polars` dep
# for why `lazy`/`fmt`/`dtype-full` and not `streaming`. `pivot` (unlike `csv`) doesn't bundle
# `streaming` at the umbrella-crate level, so it's safe to enable directly here -- needed for
# `std_lib::dataframe::pivot`.
polars = { path = "/Users/wow/code/dsa/polars/crates/polars", optional = true, default-features = false, features = [
    "lazy",
    "fmt",
    "dtype-full",
    "pivot",
] }
# depended on directly (not via `polars`'s own `csv` feature) for `CsvReadOptions`/`CsvReader`,
# used by `std_lib::dataframe::from_csv` to read an in-memory CSV string into a `DataFrame`.
# `polars`'s own `csv` feature unconditionally bundles in `streaming`, which this local clone's
# `polars-io` cloud module doesn't build against (an unrelated `object_store` version mismatch --
# see the note on the `polars` dep above); `polars-io/csv` on its own pulls in neither. Same repo
# path as the `polars` dep above, so Cargo resolves this to the identical `DataFrame`/`Column`
# types `polars::frame`/`polars::prelude` re-export, not a second copy.
polars-io = { path = "/Users/wow/code/dsa/polars/crates/polars-io", optional = true, default-features = false, features = [
    "csv",
] }
# `std_lib::darkly` (a `.darkly` file's own layer/manifest format, not a game-engine dependency):
# `zip` unpacks the container, `serde`+`serde_json` deserialize `manifest.json` into local
# structs. Both optional, gated behind the `darkly` feature below -- see the note on `vm`'s
# `polars` dep for why this isn't just an unconditional dependency.
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }
serde = { version = "1", optional = true, features = ["derive"] }

[features]
default = ["dataframe", "darkly"]
dataframe = ["dep:polars", "dep:polars-io", "vm/dataframe"]
darkly = ["dep:zip", "dep:serde", "vm/darkly"]

[dev-dependencies]
parse = { package = "mimas-parse", path = "../parse", version = "0.2.0" }
solve = { package = "mimas-solve", path = "../solve", version = "0.2.0" }
compile = { package = "mimas-compile", path = "../compile", version = "0.2.0" }
pretty_assertions.workspace = true
